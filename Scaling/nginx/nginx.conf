events {
    worker_connections 1024;
}

http {
    # Логуємо який саме upstream обслужив запит - для перевірки балансування
    log_format upstreamlog '$remote_addr -> $upstream_addr [$status] $request_time s';

    # Docker Compose автоматично резолвить service-імʼя `api` у всі контейнери
    # цього сервісу. Якщо `--scale api=3` - тут буде 3 IP, round-robin балансує.
    upstream api_backend {
        server api:8080;
    }

    server {
        listen 80;

        access_log /var/log/nginx/access.log upstreamlog;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Таймаути
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Endpoint для діагностики - показує що балансер живий
        location /_lb_check {
            return 200 "nginx upstream resolved to api_backend\n";
            add_header Content-Type text/plain;
        }
    }
}
