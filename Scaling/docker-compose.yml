services:
  postgres:
    image: postgres:16-alpine
    container_name: gs-postgres
    environment:
      POSTGRES_DB: GateSenseDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gsnet

  api:
    build:
      context: ../
      dockerfile: GateSense/GetSense.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DataContext: "Host=postgres;Port=5432;Database=GateSenseDB;Username=postgres;Password=postgres;TcpKeepAlive=True"
      AudienceTokenConfig__JwtKey: "scaling-demo-key-please-change-in-production-1234567890"
      AudienceTokenConfig__JwtIssuer: "http://localhost"
      AudienceTokenConfig__JwtAudience: "http://localhost"
      AudienceTokenConfig__JwtExpirationInMinutes: "60"
      AudienceTokenConfig__RefreshTokenExpirationInDays: "7"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gsnet
    # Не виставляємо порти назовні - доступ тільки через nginx

  nginx:
    image: nginx:alpine
    container_name: gs-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - gsnet

volumes:
  pgdata:

networks:
  gsnet:
    driver: bridge
